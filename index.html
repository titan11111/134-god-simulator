// ============================================================
//  Audio Engine
// ============================================================
class AudioEngine {
  constructor() { this.ac=null; this.bgmSrc=null; this.bgmGain=null; this.enabled=false; this.currentBgm=''; }
  _init() {
    if (this.ac) return;
    try {
      this.ac = new (window.AudioContext||window.webkitAudioContext)();
      this.bgmGain = this.ac.createGain();
      this.bgmGain.gain.value = 0.2;
      this.bgmGain.connect(this.ac.destination);
      this.enabled = true;
    } catch(e){ this.enabled=false; }
  }
  enable() { this._init(); if(this.ac&&this.ac.state==='suspended') this.ac.resume(); }

  _note(freq, dur, type='square', vol=0.15, delay=0) {
    if (!this.enabled) return;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=type; o.frequency.value=freq;
    const t=this.ac.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.ac.destination);
    o.start(t); o.stop(t+dur+0.05);
  }

  _stopBgm() { if(this.bgmSrc){try{this.bgmSrc.stop();}catch(e){}this.bgmSrc=null;} this.currentBgm=''; }

  playBgm(name) {
    if (!this.enabled||this.currentBgm===name) return;
    this._stopBgm(); this.currentBgm=name;
    const ac=this.ac, bpm=name==='battle'?160:120, beat=60/bpm;
    let notes=[];
    if (name==='title') {
      const s=[523,587,659,784,880,1047,1175,1319];
      [0,2,4,5,4,2,0,4,5,7,5,4,2,5,4,2].forEach((n,i)=>notes.push({f:s[n],t:i*beat*0.5,d:beat*0.45}));
    } else if (name==='field') {
      const s=[523,587,659,698,784,880,988,1047];
      [0,1,2,3,4,3,2,1,0,2,4,5,4,3,2,0].forEach((n,i)=>notes.push({f:s[n],t:i*beat*0.5,d:beat*0.45}));
    } else if (name==='battle') {
      const s=[220,247,262,294,330,349,392,440];
      [0,0,3,0,5,0,7,5,3,0,5,3,2,0,5,3].forEach((n,i)=>notes.push({f:s[n],t:i*beat*0.25,d:beat*0.2}));
    } else if (name==='ending') {
      const s=[523,659,784,880,1047,1319,1568,2093];
      [0,2,4,5,7,5,4,2,0,4,5,7,5,4,7,5].forEach((n,i)=>notes.push({f:s[n],t:i*beat*0.5,d:beat*0.45}));
    }
    if (!notes.length) return;
    const loopLen=notes[notes.length-1].t+beat;
    const buf=ac.createBuffer(1,Math.ceil(loopLen*ac.sampleRate),ac.sampleRate);
    const data=buf.getChannelData(0);
    notes.forEach(n=>{
      const start=Math.floor(n.t*ac.sampleRate), len=Math.floor(n.d*ac.sampleRate);
      for(let i=0;i<len;i++){
        const env=Math.min(1,i/(ac.sampleRate*0.01))*Math.min(1,(len-i)/(ac.sampleRate*0.05));
        const v=(Math.floor(i/ac.sampleRate*n.f*2)%2===0?0.08:-0.08)*env;
        if(start+i<data.length) data[start+i]+=v;
      }
    });
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    src.connect(this.bgmGain); src.start(); this.bgmSrc=src;
  }

  se(type) {
    if(!this.enabled)return;
    switch(type){
      case 'decide':  this._note(880,0.07,'square',0.18); this._note(1100,0.07,'square',0.18,0.09); break;
      case 'cancel':  this._note(440,0.12,'square',0.15); this._note(330,0.12,'square',0.15,0.09); break;
      case 'damage':  this._note(220,0.08,'sawtooth',0.22); this._note(180,0.1,'sawtooth',0.22,0.06); break;
      case 'heal':    this._note(660,0.09,'sine',0.18); this._note(880,0.09,'sine',0.18,0.1); this._note(1100,0.12,'sine',0.18,0.2); break;
      case 'fanfare': [523,659,784,880,1047,1319].forEach((f,i)=>this._note(f,0.14,'square',0.18,i*0.1)); break;
      case 'gameover':this._note(440,0.28,'square',0.18); this._note(330,0.33,'square',0.18,0.28); this._note(220,0.5,'square',0.18,0.62); break;
      case 'cursor':  this._note(660,0.05,'square',0.09); break;
      case 'text':    this._note(1320,0.025,'square',0.06); break;
    }
  }
}
const Audio = new AudioEngine();

// ============================================================
//  Input Manager
// ============================================================
const Input = {
  keys:{}, pressed:{},
  mobile:{up:false,down:false,left:false,right:false,a:false,b:false,start:false},
  mobilePressed:{a:false,b:false,start:false},
  _upHeld:false, _downHeld:false,

  init() {
    window.addEventListener('keydown',e=>{
      if(!this.keys[e.code]) this.pressed[e.code]=true;
      this.keys[e.code]=true;
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup',e=>{ this.keys[e.code]=false; });
    this._bindMobile();
    canvas.addEventListener('pointerdown',()=>{ Audio.enable(); this.mobilePressed.a=true; this.mobile.a=true; });
    canvas.addEventListener('pointerup',()=>{ this.mobile.a=false; });
  },

  _bindMobile() {
    const map={'btn-up':'up','btn-down':'down','btn-left':'left','btn-right':'right','btn-a':'a','btn-b':'b','btn-start':'start'};
    const actions=new Set(['a','b','start']);
    Object.entries(map).forEach(([id,key])=>{
      const el=document.getElementById(id); if(!el)return;
      el.addEventListener('pointerdown',e=>{
        e.preventDefault(); Audio.enable();
        this.mobile[key]=true;
        if(actions.has(key)) this.mobilePressed[key]=true;
        el.classList.add('active');
      });
      ['pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev,e=>{
        e.preventDefault(); this.mobile[key]=false; el.classList.remove('active');
      }));
    });
  },

  isDown(code){ return !!this.keys[code]; },
  wasPressed(code){ if(this.pressed[code]){delete this.pressed[code];return true;}return false; },
  wasMobilePressed(key){ if(this.mobilePressed[key]){this.mobilePressed[key]=false;return true;}return false; },

  isAction(){ return this.wasPressed('KeyZ')||this.wasPressed('Enter')||this.wasPressed('Space')||this.wasMobilePressed('a'); },
  isCancel(){ return this.wasPressed('KeyX')||this.wasPressed('Escape')||this.wasMobilePressed('b'); },
  isUp(){
    const k=this.wasPressed('ArrowUp');
    const m=this.mobile.up&&!this._upHeld?(this._upHeld=true,true):false;
    return k||m;
  },
  isDown2(){
    const k=this.wasPressed('ArrowDown');
    const m=this.mobile.down&&!this._downHeld?(this._downHeld=true,true):false;
    return k||m;
  },
  tick(){
    if(!this.mobile.up) this._upHeld=false;
    if(!this.mobile.down) this._downHeld=false;
  },

  // ─── Gamepad API（任天堂コントローラー対応）───
  _gpAHeld:false, _gpBHeld:false, _gpStartHeld:false, _gpConnected:false,

  initGamepad(){
    window.addEventListener('gamepadconnected', e=>{
      this._gpConnected=true;
      console.log('🎮 コントローラー接続:', e.gamepad.id);
      Audio.enable();
    });
    window.addEventListener('gamepaddisconnected', ()=>{ this._gpConnected=false; });
  },

  pollGamepad(){
    const gpads = navigator.getGamepads ? navigator.getGamepads() : [];
    for(const gp of gpads){
      if(!gp) continue;
      // ─ アナログスティック + Dパッド → 移動 ─
      const lx=gp.axes[0]||0, ly=gp.axes[1]||0, dz=0.35;
      this.mobile.left  = gp.buttons[14]?.pressed || lx < -dz;
      this.mobile.right = gp.buttons[15]?.pressed || lx >  dz;
      this.mobile.up    = gp.buttons[12]?.pressed || ly < -dz;
      this.mobile.down  = gp.buttons[13]?.pressed || ly >  dz;

      // ─ ボタン（Switch: A=idx1 決定, B=idx0 キャンセル, +=idx9 スタート）─
      const btnA   = gp.buttons[1]?.pressed;
      const btnB   = gp.buttons[0]?.pressed;
      const btnPlus= gp.buttons[9]?.pressed;

      if(btnA && !this._gpAHeld){ this.mobilePressed.a=true; this._gpAHeld=true; }
      if(!btnA) this._gpAHeld=false;

      if(btnB && !this._gpBHeld){ this.mobilePressed.b=true; this._gpBHeld=true; }
      if(!btnB) this._gpBHeld=false;

      if(btnPlus && !this._gpStartHeld){ this.mobilePressed.start=true; this._gpStartHeld=true; }
      if(!btnPlus) this._gpStartHeld=false;

      break; // 最初の有効なコントローラーのみ使用
    }
  }
};
Input.init();
Input.initGamepad();

const GS = {
  tick: 0,
  turn: 1, maxTurns: 5,
  stats: {happy:50, tech:50, env:50, order:50},
  flags: {learnedAcademy:false},
  floats: [], // {x,y,text,color,vy,life,maxLife}
  playerMoved: 0,
  bEnemyShake: 0, bPlayerShake: 0,

  addStat(key, val) {
    const old=this.stats[key];
    this.stats[key]=Math.max(0,Math.min(100,old+val));
    const diff=this.stats[key]-old;
    if(diff!==0){
      const xs={happy:80,tech:230,env:380,order:530};
      this.floats.push({x:xs[key]||320,y:H-80,text:(diff>0?'+':'')+diff,color:diff>0?'#4f4':'#f44',vy:-1.4,life:80,maxLife:80});
    }
  },

  checkEnding(){
    const s=this.stats, f=this.flags;
    if(f.learnedAcademy&&s.tech>70&&s.env>70) return 7;
    if(s.happy<20&&s.tech<20&&s.env<20&&s.order<20) return 8;
    if(s.happy>70&&s.order>60) return 1;
    if(s.tech>70&&s.order>70) return 2;
    if(s.env>70&&s.happy>60) return 3;
    if(s.happy>=40&&s.happy<=70&&s.tech>=40&&s.tech<=70&&s.env>=40&&s.env<=70&&s.order>=40&&s.order<=70) return 4;
    if(s.env<30&&s.happy<30) return 5;
    if(s.order<20) return 6;
    return 4;
  }
};

const Sprite = {
  drawKing(x,y,dir,frame){
    const bx=Math.floor(x),by=Math.floor(y),f=frame%2;
    // 足
    ctx.fillStyle='#2244aa';
    if(f===0){ctx.fillRect(bx+4,by+22,4,9);ctx.fillRect(bx+10,by+22,4,9);}
    else{ctx.fillRect(bx+3,by+22,4,10);ctx.fillRect(bx+11,by+22,4,10);}
    // 体
    ctx.fillStyle='#2255cc'; ctx.fillRect(bx+3,by+12,12,11);
    // 腕
    ctx.fillStyle='#2244aa'; ctx.fillRect(bx+1,by+13,3,7); ctx.fillRect(bx+14,by+13,3,7);
    // 顔
    ctx.fillStyle='#ffcc88'; ctx.fillRect(bx+4,by+4,10,9);
    // 目
    ctx.fillStyle='#000'; ctx.fillRect(bx+6,by+6,2,2); ctx.fillRect(bx+10,by+6,2,2);
    ctx.fillRect(bx+7,by+10,4,1); // 口
    // 王冠
    ctx.fillStyle=P.gold;

  drawMinister(x,y,dir,frame){

    ctx.fillStyle='#9a8070'; ctx.fillRect(bx+3,by+12,12,11);
    ctx.fillStyle='#ffcc88'; ctx.fillRect(bx+4,by+5,10,8);
    ctx.fillStyle='#aaa'; ctx.fillRect(bx+3,by+1,12,5); ctx.fillRect(bx+2,by+5,14,2);
    ctx.fillStyle='#888'; ctx.fillRect(bx+17,by+4,2,16);
    ctx.fillStyle='#ccc'; ctx.fillRect(bx+15,by+1,5,5);
  },
  drawGoblin(x,y,frame){
    const bx=Math.floor(x),by=Math.floor(y),bob=frame%2;
    ctx.fillStyle='#2a7a2a'; ctx.fillRect(bx+4,by+24+bob,5,8); ctx.fillRect(bx+11,by+24+bob,5,8);
    ctx.fillStyle='#3a8a3a'; ctx.fillRect(bx+3,by+14+bob,14,11);
    ctx.fillStyle='#4aaa4a'; ctx.fillRect(bx+4,by+5+bob,12,10);
    ctx.fillStyle='#f22'; ctx.fillRect(bx+5,by+7+bob,3,3); ctx.fillRect(bx+12,by+7+bob,3,3);
    ctx.fillStyle='#fff'; ctx.fillRect(bx+6,by+12+bob,2,3); ctx.fillRect(bx+12,by+12+bob,2,3);
    ctx.fillStyle='#4aaa4a'; ctx.fillRect(bx+1,by+6+bob,4,6); ctx.fillRect(bx+15,by+6+bob,4,6);
  },
  drawKnight(x,y,frame){
    const bx=Math.floor(x),by=Math.floor(y),bob=frame%2*2;
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx+3,by+26+bob,6,8); ctx.fillRect(bx+11,by+26+bob,6,8);
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx+2,by+14+bob,16,13);
    ctx.fillStyle='#2a2a2a'; ctx.fillRect(bx+4,by+16+bob,12,9);
    ctx.fillStyle='#111'; ctx.fillRect(bx+3,by+4+bob,14,11);
    ctx.fillStyle='#f00'; ctx.fillRect(bx+5,by+7+bob,3,2); ctx.fillRect(bx+12,by+7+bob,3,2);
    ctx.fillStyle='#880000'; ctx.fillRect(bx+4,by+1+bob,3,5); ctx.fillRect(bx+13,by+1+bob,3,5);
    ctx.fillStyle='#aaa'; ctx.fillRect(bx+18,by+8+bob,3,20);
    ctx.fillStyle='#888'; ctx.fillRect(bx+15,by+14+bob,9,3);
  },
  drawDemon(x,y,frame){
    const bx=Math.floor(x),by=Math.floor(y),bob=frame%2;
    ctx.fillStyle='#8a1a1a'; ctx.fillRect(bx+3,by+24+bob,6,8); ctx.fillRect(bx+11,by+24+bob,6,8);
    ctx.fillStyle='#aa2222'; ctx.fillRect(bx+2,by+13+bob,16,12);
    ctx.fillStyle='#cc2222'; ctx.fillRect(bx+4,by+5+bob,12,9);
    ctx.fillStyle='#ff0'; ctx.fillRect(bx+5,by+7+bob,3,3); ctx.fillRect(bx+12,by+7+bob,3,3);
    ctx.fillStyle='#cc0000'; ctx.fillRect(bx+3,by+1+bob,3,6); ctx.fillRect(bx+14,by+1+bob,3,6);
    ctx.fillStyle='#550000'; ctx.fillRect(bx-4,by+10+bob,7,10); ctx.fillRect(bx+17,by+10+bob,7,10);
  },

  drawTile(tx,ty,sx,sy){
    const type=MAPDATA[ty]?.[tx]??0;
    switch(type){
      case 0:this._grass(sx,sy);break; case 1:this._water(sx,sy);break;
      case 2:this._stone(sx,sy);break; case 3:this._building(sx,sy);break;
      case 4:this._wall(sx,sy);break;  case 5:this._tree(sx,sy);break;
      case 6:this._gravel(sx,sy);break;
      default:ctx.fillStyle=P.grass;ctx.fillRect(sx,sy,TILE,TILE);
    }
  },
  // タイル境界線（視認性の要）
  _border(x,y){
    ctx.fillStyle='rgba(0,0,0,0.28)';
    ctx.fillRect(x+TILE-1,y,1,TILE);
    ctx.fillRect(x,y+TILE-1,TILE,1);
    ctx.fillStyle='rgba(255,255,255,0.10)';
    ctx.fillRect(x,y,TILE,1);
    ctx.fillRect(x,y,1,TILE);
  },

  _grass(x,y){
    // ベース
    const alt=((Math.floor(x/TILE)+Math.floor(y/TILE))%2)===0;
    ctx.fillStyle=alt?P.grass:P.grassAcc; ctx.fillRect(x,y,TILE,TILE);
    // 草むらのハイライト帯（上部）
    ctx.fillStyle=P.grassL;
    ctx.fillRect(x+2,y+1,4,2); ctx.fillRect(x+18,y+3,5,2); ctx.fillRect(x+10,y+0,3,1);
    // 暗い草の影（下部・奥行き感）
    ctx.fillStyle=P.grassD;
    ctx.fillRect(x,y+TILE-4,TILE,4);
    // ドット草テクスチャ
    ctx.fillStyle=P.grassL;
    if((x+y)%96===0){ctx.fillRect(x+6,y+8,2,4);ctx.fillRect(x+8,y+6,2,6);}
    if((x+y)%80===0){ctx.fillRect(x+20,y+10,2,4);ctx.fillRect(x+22,y+8,2,6);}
    if((x+y)%64===0){ctx.fillRect(x+14,y+16,2,3);}
    this._border(x,y);
  },

  _water(x,y){
    const t=GS.tick;
    // 深い水色ベース
    ctx.fillStyle=P.waterD; ctx.fillRect(x,y,TILE,TILE);
    // 中間色
    ctx.fillStyle=P.water; ctx.fillRect(x,y+4,TILE,TILE-4);
    // アニメ波
    const wo=Math.sin(t*0.06+(x+y)*0.12)*4;
    ctx.fillStyle=P.waterL;
    ctx.fillRect(x+2+wo,y+6,12,3); ctx.fillRect(x+16-wo,y+16,10,3);
    ctx.fillRect(x+4+wo,y+24,8,2);
    // 白波キラキラ
    ctx.fillStyle=P.waterW;
    ctx.fillRect(x+2+wo,y+6,4,1); ctx.fillRect(x+16-wo,y+16,3,1);
    // 上端ハイライト
    ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(x,y,TILE,2);
    this._border(x,y);
  },

  _stone(x,y){
    ctx.fillStyle=P.stone; ctx.fillRect(x,y,TILE,TILE);
    // 石畳の目地（モルタル）
    ctx.fillStyle=P.stoneMortar;
    ctx.fillRect(x,y,TILE,2);              // 上目地
    ctx.fillRect(x,y,2,TILE);             // 左目地
    ctx.fillRect(x+TILE/2,y+2,2,TILE-2); // 縦中央目地
    ctx.fillRect(x+2,y+TILE/2,TILE-2,2); // 横中央目地
    // 石ブロック面（ハイライト）
    ctx.fillStyle=P.stoneL;
    ctx.fillRect(x+3,y+3,TILE/2-5,TILE/2-5);
    ctx.fillRect(x+TILE/2+3,y+3,TILE/2-5,TILE/2-5);
    ctx.fillRect(x+3,y+TILE/2+3,TILE/2-5,TILE/2-5);
    ctx.fillRect(x+TILE/2+3,y+TILE/2+3,TILE/2-5,TILE/2-5);
    // 影
    ctx.fillStyle=P.stoneD; ctx.fillRect(x,y+TILE-2,TILE,2); ctx.fillRect(x+TILE-2,y,2,TILE);
    this._border(x,y);
  },

  _building(x,y){
    // 壁面（木材）
    ctx.fillStyle=P.woodD; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle=P.wood; ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
    // 屋根
    ctx.fillStyle='#c06010'; ctx.fillRect(x,y,TILE,6);
    ctx.fillStyle='#e07828'; ctx.fillRect(x+1,y+1,TILE-2,3);
    // 壁面ハイライト
    ctx.fillStyle=P.woodL; ctx.fillRect(x+2,y+8,6,TILE-10); ctx.fillRect(x+2,y+7,TILE-4,2);
    // 窓
    ctx.fillStyle='#ffe88a'; ctx.fillRect(x+7,y+9,8,8);
    ctx.fillStyle='#a0600c'; ctx.fillRect(x+10,y+9,2,8); ctx.fillRect(x+7,y+12,8,2);
    // ドア
    ctx.fillStyle='#5a2e08'; ctx.fillRect(x+10,y+19,6,TILE-20);
    ctx.fillStyle='#8b4513'; ctx.fillRect(x+11,y+20,4,TILE-22);
    this._border(x,y);
  },

  _wall(x,y){
    ctx.fillStyle=P.wall; ctx.fillRect(x,y,TILE,TILE);
    // 石レンガパターン（交互オフセット）
    for(let r=0;r<4;r++){
      const offset=(r%2)*8;
      for(let c=0;c<3;c++){
        const bx=x+offset+c*16-8, by2=y+r*8;
        if(bx<x||bx+14>x+TILE) continue;
        ctx.fillStyle=P.castleD; ctx.fillRect(bx,by2,14,7);
        ctx.fillStyle=P.wallL; ctx.fillRect(bx+1,by2+1,12,2);
      }
    }
    // 上端の凹凸（胸壁）
    ctx.fillStyle=P.wallL; ctx.fillRect(x,y,8,4); ctx.fillRect(x+16,y,8,4);
    ctx.fillStyle=P.wall;   ctx.fillRect(x+8,y,8,4);
    this._border(x,y);
  },

  _tree(x,y){
    // 地面
    ctx.fillStyle=P.grassAcc; ctx.fillRect(x,y,TILE,TILE);
    // 幹（太め・茶色）
    ctx.fillStyle='#5a3010'; ctx.fillRect(x+12,y+16,8,TILE-16);
    ctx.fillStyle='#7a4818'; ctx.fillRect(x+13,y+17,5,TILE-18);
    // 葉（3層ピラミッド、鮮明な緑）
    ctx.fillStyle='#186018'; ctx.fillRect(x+2,y+8,28,16);   // 下層（影）
    ctx.fillStyle='#22a022'; ctx.fillRect(x+4,y+5,24,16);   // 中層
    ctx.fillStyle='#2ecc2e'; ctx.fillRect(x+7,y+2,18,14);   // 上層
    ctx.fillStyle='#50e050'; ctx.fillRect(x+10,y,12,10);    // 先端
    // ハイライト（左上）
    ctx.fillStyle='#60ff60'; ctx.fillRect(x+10,y+1,4,3); ctx.fillRect(x+7,y+4,4,2);
    this._border(x,y);
  },

  _gravel(x,y){
    // ベース（温かみのある土色）
    ctx.fillStyle='#8a7260'; ctx.fillRect(x,y,TILE,TILE);
    // 小石（明るい色で浮き上がり感）
    ctx.fillStyle='#b09878';
    ctx.fillRect(x+3,y+4,7,5); ctx.fillRect(x+16,y+10,8,5);
    ctx.fillRect(x+8,y+19,6,5); ctx.fillRect(x+20,y+22,7,6);
    ctx.fillRect(x+1,y+22,5,4); ctx.fillRect(x+24,y+5,5,4);
    // 小石の影
    ctx.fillStyle='#604e3c';
    ctx.fillRect(x+8,y+7,2,2); ctx.fillRect(x+22,y+13,2,2);
    ctx.fillRect(x+12,y+22,2,2); ctx.fillRect(x+25,y+8,2,2);
    // 砂利ハイライト
    ctx.fillStyle='#c8b090';
    ctx.fillRect(x+3,y+4,3,2); ctx.fillRect(x+16,y+10,4,2);
    this._border(x,y);
  }
};

//  DialogBox
// ============================================================
class DialogBox {
  constructor(){ this.reset(); }
  reset(){
    this.lines=[]; this.choices=[]; this.choiceIdx=0;
    this.charIdx=0; this.lineIdx=0; this.showChoices=false;
    this.done=false; this.timer=0; this.blinkTimer=0;
  }
  show(lines,choices=[]){ this.reset(); this.lines=Array.isArray(lines)?lines:[lines]; this.choices=choices; }
  update(){
    this.blinkTimer++;
    const line=this.lines[this.lineIdx]||'';
    this.timer++;
    if(this.timer%2===0&&this.charIdx<line.length){
      this.charIdx++;
      if(this.charIdx%4===0) Audio.se('text');
    }
  }
  isFullyShown(){ return this.charIdx>=(this.lines[this.lineIdx]||'').length; }
  advance(){
    if(!this.isFullyShown()){ this.charIdx=(this.lines[this.lineIdx]||'').length; return; }
    if(this.lineIdx<this.lines.length-1){ this.lineIdx++; this.charIdx=0; }
    else if(this.choices.length&&!this.showChoices){ this.showChoices=true; }
    else if(!this.choices.length){ this.done=true; }
  }
  selectUp(){ if(this.choiceIdx>0){this.choiceIdx--;Audio.se('cursor');} }
  selectDown(){ if(this.choiceIdx<this.choices.length-1){this.choiceIdx++;Audio.se('cursor');} }
  getSelected(){ return this.choiceIdx; }

  draw(x=10,y=H-130,w=W-20,h=120){
    ctx.fillStyle=P.dialogBg; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=P.gold; ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
    ctx.strokeStyle='#886600'; ctx.lineWidth=1; ctx.strokeRect(x+3,y+3,w-6,h-6);

    const line=this.lines[this.lineIdx]||'';
    const shown=line.substring(0,this.charIdx);
    ctx.fillStyle='#fff'; ctx.font='14px monospace';
    shown.split('\n').forEach((p,i)=>ctx.fillText(p,x+12,y+24+i*20));

    if(this.showChoices){
      this.choices.forEach((c,i)=>{
        ctx.fillStyle=i===this.choiceIdx?P.gold:'#ccc';
        ctx.fillText((i===this.choiceIdx?'► ':' ')+c.label,x+20,y+60+i*22);
      });
    } else if(this.isFullyShown()){
      if(Math.floor(this.blinkTimer/20)%2===0){ ctx.fillStyle=P.gold; ctx.fillText('▼',x+w-24,y+h-10); }
    }
  }
}

const Player = {
  x:10*TILE, y:8*TILE, dir:1, frame:0, frameTick:0, canMove:true,
  speed:2.5,

  update(){
    if(!this.canMove) return;
    let dx=0,dy=0;
    if(Input.isDown('ArrowLeft') ||Input.mobile.left){dx=-this.speed;this.dir=2;}
    if(Input.isDown('ArrowRight')||Input.mobile.right){dx=this.speed;this.dir=3;}
    if(Input.isDown('ArrowUp')   ||Input.mobile.up){dy=-this.speed;this.dir=0;}
    if(Input.isDown('ArrowDown') ||Input.mobile.down){dy=this.speed;this.dir=1;}
    if(dx!==0&&dy!==0){dx*=0.707;dy*=0.707;}

    if(dx!==0||dy!==0){
      const nx=this.x+dx, ny=this.y+dy;
      const isSolid=(cx,cy)=>{
        if(cy<0||cy>=ROWS||cx<0||cx>=COLS)return true;
        return SOLID_TILES.has(MAPDATA[cy]?.[cx]??0);
      };
      const t1x=Math.floor((nx+6)/TILE),  t1y=Math.floor((ny+6)/TILE);
      const t2x=Math.floor((nx+22)/TILE), t2y=Math.floor((ny+28)/TILE);
      const okX=!isSolid(Math.floor((nx+6)/TILE),Math.floor((this.y+6)/TILE))&&!isSolid(Math.floor((nx+22)/TILE),Math.floor((this.y+28)/TILE));
      const okY=!isSolid(Math.floor((this.x+6)/TILE),Math.floor((ny+6)/TILE))&&!isSolid(Math.floor((this.x+22)/TILE),Math.floor((ny+28)/TILE));
      if(okX) this.x=Math.max(TILE,Math.min(nx,(COLS-2)*TILE));
      if(okY) this.y=Math.max(TILE,Math.min(ny,(ROWS-2)*TILE));
      if(okX||okY) GS.playerMoved++;
      this.frameTick++;
      if(this.frameTick>=10){this.frameTick=0;this.frame=(this.frame+1)%2;}
    }
    Camera.update(this.x+TILE/2,this.y+TILE/2);
  },
  draw(){
    Sprite.drawKing(this.x-Camera.x,this.y-Camera.y,this.dir,this.frame);
  }
};

    const sh=arr=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
    const early=sh([0,1,2,3]).slice(0,2);
    const late=sh([5,6,7]).slice(0,1);
    this.queue=[...early, 4, ...late, 8];
  },
  getCurrent(){ const idx=this.queue[GS.turn-1]; return idx!==undefined?EVENTS[idx]:null; },
  apply(choiceIdx){
    const ev=this.getCurrent(); if(!ev)return null;
    const ch=ev.choices[choiceIdx]; if(!ch)return null;
    if(ch.flag) GS.flags[ch.flag]=true;
    Object.entries(ch.effect||{}).forEach(([k,v])=>GS.addStat(k,v));
    return ch.battle?{battle:ch.battle}:null;
  }
};

//  Battle System
// ============================================================
const Battle = {
  enemyDefs:{
    goblin:{name:'ゴブリンの群れ',hp:60,maxHp:60,atk:12,def:3,reward:{order:10},draw:(x,y,f)=>Sprite.drawGoblin(x,y,f)},
    knight:{name:'飢饉の騎士',    hp:120,maxHp:120,atk:22,def:8,reward:{happy:20},draw:(x,y,f)=>Sprite.drawKnight(x,y,f)},
    demon: {name:'悪魔',          hp:80, maxHp:80, atk:18,def:5,reward:{order:15},draw:(x,y,f)=>Sprite.drawDemon(x,y,f)},
  },
  type:'goblin', enemy:null,
  pHP:100, pMaxHP:100, pMP:30, pMaxMP:30,
  phase:'player', cmdIdx:0,
  cmdList:['たたかう','まほう','にげる'],
  log:[], result:'',

  init(type){
    this.type=type;
    const def=this.enemyDefs[type]||this.enemyDefs.goblin;
    // JSON複製だと関数(draw)が消えるので、関数を保持したまま必要分だけ複製する
    this.enemy={
      name:def.name,
      hp:def.hp,
      maxHp:def.maxHp,
      atk:def.atk,
      def:def.def,
      reward:Object.assign({},def.reward||{}),
      draw:def.draw
    };
    this.pHP=this.pMaxHP; this.pMP=this.pMaxMP;
    this.phase='player'; this.cmdIdx=0; this.log=[]; this.result='';
    this._addLog('⚔ '+this.enemy.name+'があらわれた！');
    Audio.playBgm('battle');
  },
  _addLog(msg){ this.log.push(msg); if(this.log.length>5)this.log.shift(); },

  update(){
    if(this.phase==='result'){
      if(Input.isAction()) Scenes.endBattle(this.result);
      Input.tick(); return;
    }
    if(this.phase==='player'){
      if(Input.isUp()){this.cmdIdx=(this.cmdIdx+this.cmdList.length-1)%this.cmdList.length;Audio.se('cursor');}
      if(Input.isDown2()){this.cmdIdx=(this.cmdIdx+1)%this.cmdList.length;Audio.se('cursor');}
      if(Input.isAction()){ Audio.se('decide'); this._playerCmd(); }
    } else if(this.phase==='enemy'){
      this._enemyTurn();
    }
    Input.tick();
  },

  _playerCmd(){
    const cmd=this.cmdList[this.cmdIdx];
    if(cmd==='たたかう'){
      const dmg=Math.max(1,Math.floor(18*(0.8+Math.random()*0.4)-this.enemy.def));
      this.enemy.hp=Math.max(0,this.enemy.hp-dmg);
      this._addLog('王様の攻撃！ → '+dmg+'ダメージ！'); Audio.se('damage'); GS.bEnemyShake=12;
      if(this.enemy.hp<=0){this._win();return;}
      this.phase='enemy';
    } else if(cmd==='まほう'){
      if(this.pMP<8){this._addLog('MPが足りない！');return;}
      this.pMP-=8;
      const dmg=Math.max(1,Math.floor(28*(0.9+Math.random()*0.2)-Math.floor(this.enemy.def/2)));
      this.enemy.hp=Math.max(0,this.enemy.hp-dmg);
      this._addLog('全体魔法！ → '+dmg+'ダメージ！'); Audio.se('damage'); GS.bEnemyShake=16;
      if(this.enemy.hp<=0){this._win();return;}
      this.phase='enemy';
    } else if(cmd==='にげる'){
      if(Math.random()<0.5){this._addLog('逃げ出した！'); this.result='flee'; this.phase='result'; Audio.se('cancel');}
      else{this._addLog('逃げられなかった！'); this.phase='enemy';}
    }
  },
  _enemyTurn(){
    const e=this.enemy;
    if(Math.random()<0.2){
      const h=Math.floor(e.maxHp*0.1); e.hp=Math.min(e.maxHp,e.hp+h);
      this._addLog(e.name+'は体力を回復した（'+h+'）！'); Audio.se('heal');
    } else {
      const dmg=Math.max(1,Math.floor(e.atk*(0.8+Math.random()*0.4)-3));
      this.pHP-=dmg;
      this._addLog(e.name+'の攻撃！ → '+dmg+'ダメージ！'); Audio.se('damage'); GS.bPlayerShake=12;
    }
    if(this.pHP<=0){ this.pHP=0; this._addLog('王様は倒れてしまった...'); this.result='lose'; this.phase='result'; Audio.se('gameover'); }
    else { this.phase='player'; }
  },
  _win(){ this._addLog('勝利！ステータスボーナス獲得！'); this.result='win'; this.phase='result'; Audio.se('fanfare'); },

  draw(){
    // BG
    ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,H/2,0,H);
    g.addColorStop(0,'#1a1a2a'); g.addColorStop(1,'#2a2030');
    ctx.fillStyle=g; ctx.fillRect(0,H/2,W,H/2);

    // Enemy sprite
    const e=this.enemy;
    if(e){
      const ex=W/2-32+(GS.bEnemyShake>0?(Math.random()*8-4):0);
      const ey=H/2-110;
      if(GS.bEnemyShake>0) GS.bEnemyShake--;
      e.draw(ex,ey,Math.floor(GS.tick/15)%2);
      // HP bar
      ctx.fillStyle='#222'; ctx.fillRect(W/2-70,ey-22,140,10);
      ctx.fillStyle=e.hp/e.maxHp>0.5?'#4af':e.hp/e.maxHp>0.2?'#fa0':'#f33';
      ctx.fillRect(W/2-70,ey-22,Math.floor(140*e.hp/e.maxHp),10);
      ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.strokeRect(W/2-70,ey-22,140,10);
      ctx.fillStyle='#fff'; ctx.font='12px monospace'; ctx.textAlign='center';
      ctx.fillText(e.name+'  HP:'+e.hp+'/'+e.maxHp,W/2,ey-26); ctx.textAlign='left';
    }

    // Player status
    const psx=GS.bPlayerShake>0?(Math.random()*4-2):0;
    if(GS.bPlayerShake>0) GS.bPlayerShake--;
    ctx.fillStyle=P.dialogBg; ctx.fillRect(16+psx,H-96,170,80);
    ctx.strokeStyle=P.gold; ctx.lineWidth=2; ctx.strokeRect(16+psx,H-96,170,80);
    ctx.fillStyle='#fff'; ctx.font='13px monospace'; ctx.fillText('王様',24+psx,H-78);
    // HP bar
    ctx.fillStyle='#333'; ctx.fillRect(24+psx,H-68,140,10);
    ctx.fillStyle=this.pHP/this.pMaxHP>0.5?'#4af':this.pHP/this.pMaxHP>0.2?'#fa0':'#f33';
    ctx.fillRect(24+psx,H-68,Math.floor(140*this.pHP/this.pMaxHP),10);
    ctx.strokeStyle='#666'; ctx.strokeRect(24+psx,H-68,140,10);
    ctx.fillStyle='#fff'; ctx.font='12px monospace';
    ctx.fillText('HP:'+this.pHP+'/'+this.pMaxHP,24+psx,H-50);
    ctx.fillText('MP:'+this.pMP+'/'+this.pMaxMP,100+psx,H-50);

    // Command
    ctx.fillStyle=P.dialogBg; ctx.fillRect(W-198,H-100,184,88);
    ctx.strokeStyle=P.gold; ctx.lineWidth=2; ctx.strokeRect(W-198,H-100,184,88);
    this.cmdList.forEach((cmd,i)=>{
      ctx.fillStyle=i===this.cmdIdx?P.gold:'#ccc'; ctx.font='15px monospace';
      ctx.fillText((i===this.cmdIdx?'► ':' ')+cmd,W-185,H-76+i*26);
    });

    // Battle log
    ctx.fillStyle='rgba(0,0,20,0.85)'; ctx.fillRect(8,8,W-16,92);
    ctx.strokeStyle='#446688'; ctx.lineWidth=2; ctx.strokeRect(8,8,W-16,92);
    const showLog=this.log.slice(-4);
    showLog.forEach((l,i)=>{
      ctx.fillStyle=i===showLog.length-1?'#fff':'#aaa'; ctx.font='13px monospace';
      ctx.fillText(l,18,28+i*18);
    });

    // Result
    if(this.phase==='result'){
      ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(W/2-130,H/2-55,260,108);
      ctx.strokeStyle=P.gold; ctx.lineWidth=3; ctx.strokeRect(W/2-130,H/2-55,260,108);
      ctx.fillStyle=this.result==='win'?'#ff4':'#f44'; ctx.font='bold 24px monospace'; ctx.textAlign='center';
      ctx.fillText(this.result==='win'?'VICTORY!':this.result==='flee'?'逃げた！':'DEFEAT...',W/2,H/2-10);
      if(this.result==='win'){
        const r=this.enemyDefs[this.type].reward;
        ctx.fillStyle='#4f4'; ctx.font='13px monospace';
        const nameMap={happy:'幸福',tech:'技術',env:'環境',order:'秩序'};
        const rtext=Object.entries(r).map(([k,v])=>nameMap[k]+(v>0?'+':'')+v).join(' ');
        ctx.fillText(rtext,W/2,H/2+18);
      }
      ctx.fillStyle='#bbb'; ctx.font='13px monospace';
      ctx.fillText('Zキー / Aボタンで続ける',W/2,H/2+44);
      ctx.textAlign='left';
    }
  }
};

// ============================================================
//  Scene Manager
// ============================================================
const Scenes = {
  current:'title',
  fadeAlpha:0, fadingOut:false, fadingIn:false, fadeTarget:'',
  titleTick:0, endingTick:0, endingIdx:0,
  npcDialog:null, battleType:null,
  encounterTimer:120,

  transition(to){
    Audio.se('decide');
    this.fadingOut=true; this.fadeTarget=to;
  },

  _goTo(scene){
    this.current=scene;
    this.fadingOut=false; this.fadingIn=true; this.fadeAlpha=1;
    Player.canMove=(scene==='map');
    if(scene==='title') Audio.playBgm('title');
    else if(scene==='map'){
      Audio.playBgm('field');
      this.encounterTimer=100+Math.floor(Math.random()*80);
    }
    else if(scene==='battle'){ Battle.init(this.battleType||'goblin'); }
    else if(scene==='event'){
      Audio.playBgm('field');
      const ev=EventSys.getCurrent();
      if(ev) dialog.show(ev.text.split('\n'), ev.choices.map(c=>({label:c.label})));
    }
    else if(scene==='ending'){
      this.endingTick=0;
      this.endingIdx=GS.checkEnding();
      Audio.playBgm('ending');
      Audio.se('fanfare');
    }
  },

  update(){
    if(this.fadingOut){
      this.fadeAlpha=Math.min(1,this.fadeAlpha+0.055);
      if(this.fadeAlpha>=1) this._goTo(this.fadeTarget);
      return;
    }
    if(this.fadingIn){
      this.fadeAlpha=Math.max(0,this.fadeAlpha-0.04);
      if(this.fadeAlpha<=0) this.fadingIn=false;
    }
    switch(this.current){
      case 'title':  this._updateTitle(); break;
      case 'map':    this._updateMap(); break;
      case 'battle': Battle.update(); break;
      case 'event':  this._updateEvent(); break;
      case 'ending': this._updateEnding(); break;
    }
    GS.tick++;
  },

  _updateTitle(){
    this.titleTick++;
    if(Input.isAction()||Input.wasMobilePressed('start')){
      Audio.enable(); EventSys.buildQueue(); this.transition('map');
    }
    Input.tick();
  },

  _updateMap(){
    // NPC check
    if(this.npcDialog){
      dialog.update();
      if(Input.isAction()){
        if(dialog.done){ this.npcDialog=null; Player.canMove=true; dialog.reset(); }
        else dialog.advance();
      }
      Input.tick(); return;
    }
    // NPC proximity
    for(const npc of NPCS){
      const nx=npc.tx*TILE, ny=npc.ty*TILE;
      if(Math.abs(Player.x-nx)<TILE*1.5&&Math.abs(Player.y-ny)<TILE*1.5){
        if(Input.isAction()){
          Player.canMove=false;
          dialog.show(npc.dialog,[]);
          this.npcDialog=npc; Audio.se('decide');
          Input.tick(); return;
        }
      }
    }

    Player.update();
    Input.tick();

    // Random encounter
    if(GS.playerMoved>10){
      this.encounterTimer--;
      if(this.encounterTimer<=0){
        this.encounterTimer=100+Math.floor(Math.random()*100);
        const types=['goblin','demon'];
        this.battleType=types[Math.floor(Math.random()*types.length)];
        this.transition('battle'); return;
      }
    }

    // Z key to go to event
    if(Input.wasPressed('KeyZ')||Input.wasPressed('Enter')||Input.wasMobilePressed('a')){
      this.transition('event');
    }
  },

  endBattle(result){
    if(result==='win'){
      const r=Battle.enemyDefs[Battle.type].reward;
      Object.entries(r).forEach(([k,v])=>GS.addStat(k,v));
    } else if(result==='lose'){
      GS.addStat('happy',-15); GS.addStat('order',-10);
    }
    this.battleType=null;
    if(result==='lose'&&GS.stats.happy<=0){ this.transition('ending'); }
    else { this.transition('map'); }
  },

  _updateEvent(){
    dialog.update();
    if(Input.isUp()) dialog.selectUp();
    if(Input.isDown2()) dialog.selectDown();
    if(Input.isAction()){
      if(!dialog.isFullyShown()||dialog.lineIdx<dialog.lines.length-1){
        dialog.advance();
      } else if(dialog.showChoices){
        const ci=dialog.getSelected();
        const ev=EventSys.getCurrent();
        if(ev&&ev.choices[ci]&&ev.choices[ci].battle){
          // apply non-battle effects and flag
          if(ev.choices[ci].flag) GS.flags[ev.choices[ci].flag]=true;
          Object.entries(ev.choices[ci].effect||{}).forEach(([k,v])=>GS.addStat(k,v));
          this.battleType=ev.choices[ci].battle;
          this.transition('battle'); return;
        }
        const res=EventSys.apply(ci);
        Audio.se('decide');
        if(res&&res.battle){ this.battleType=res.battle; this.transition('battle'); }
        else {
          GS.turn++;
          if(GS.turn>GS.maxTurns) this.transition('ending');
          else this.transition('map');
        }
      } else { dialog.advance(); }
    }
    Input.tick();
  },

  _updateEnding(){
    this.endingTick++;
    if(this.endingTick>120&&Input.isAction()){
      // reset
      GS.turn=1; GS.stats={happy:50,tech:50,env:50,order:50};
      GS.flags={learnedAcademy:false}; GS.floats=[]; GS.playerMoved=0;
      Player.x=5*TILE; Player.y=5*TILE;
      EventSys.buildQueue(); this.transition('title');
    }
    Input.tick();
  },

  // ──────────────────── DRAW ────────────────────
  draw(){
    ctx.clearRect(0,0,W,H);
    switch(this.current){
      case 'title':  this._drawTitle(); break;
      case 'map':    this._drawMap(); break;
      case 'battle': Battle.draw(); break;
      case 'event':  this._drawEvent(); break;
      case 'ending': this._drawEnding(); break;
    }
    // Floating numbers
    GS.floats.forEach(f=>{
      ctx.globalAlpha=f.life/f.maxLife;
      ctx.fillStyle=f.color; ctx.font='bold 18px monospace';
      ctx.fillText(f.text,f.x,f.y);
      ctx.globalAlpha=1;
      f.y+=f.vy; f.life--;
    });
    GS.floats=GS.floats.filter(f=>f.life>0);
    // Fade
    if(this.fadeAlpha>0){ ctx.fillStyle=`rgba(0,0,0,${this.fadeAlpha})`; ctx.fillRect(0,0,W,H); }
  },

  _drawTitle(){
    const t=this.titleTick;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#080820'); g.addColorStop(1,'#140c28');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // Stars
    for(let i=0;i<70;i++){
      const sx=(i*137.5%1)*W, sy=(i*99.3%1)*(H*0.65);
      ctx.globalAlpha=(Math.sin(t*0.03+i)*0.4+0.6)*0.9;
      ctx.fillStyle='#fff'; ctx.fillRect(sx,sy,i%7===0?2:1,i%7===0?2:1);
    }
    ctx.globalAlpha=1;
    // Moon
    ctx.fillStyle='#fff8e1'; ctx.beginPath(); ctx.arc(W*0.82,H*0.14,28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a0818'; ctx.beginPath(); ctx.arc(W*0.82+10,H*0.14-5,23,0,Math.PI*2); ctx.fill();
    // Castle silhouette
    ctx.fillStyle='#0e0e18';
    ctx.fillRect(W/2-90,H/2-10,180,90);
    ctx.fillRect(W/2-105,H/2-55,45,100);
    ctx.fillRect(W/2+60, H/2-55,45,100);
    ctx.fillRect(W/2-80, H/2-80,160,30);
    for(let i=0;i<6;i++) ctx.fillRect(W/2-80+i*27,H/2-95,18,18);
    for(let i=0;i<2;i++){ ctx.fillRect(W/2-107+i*14,H/2-72,12,20); ctx.fillRect(W/2+66+i*14,H/2-72,12,20); }
    // Gate
    ctx.fillStyle='#050510'; ctx.fillRect(W/2-12,H/2+30,24,50);
    ctx.beginPath(); ctx.arc(W/2,H/2+30,12,Math.PI,0); ctx.fill();
    // Title window
    const bx=W/2-185,by=50,bw=370,bh=105;
    ctx.fillStyle='rgba(0,0,14,0.88)'; ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle=P.gold; ctx.lineWidth=3; ctx.strokeRect(bx,by,bw,bh);
    ctx.strokeStyle='#7a5000'; ctx.lineWidth=1; ctx.strokeRect(bx+4,by+4,bw-8,bh-8);
    ctx.fillStyle=P.gold; ctx.font='bold 30px monospace'; ctx.textAlign='center';
    ctx.fillText('1日の王様',W/2,by+44);
    ctx.fillStyle='#ccc'; ctx.font='13px monospace';
    ctx.fillText('～ King for a Day ～',W/2,by+68);
    ctx.fillText('ターン制意思決定シミュレーター',W/2,by+88);
    ctx.textAlign='left';
    // Blink prompt
    if(Math.floor(t/30)%2===0){
      ctx.fillStyle=P.gold; ctx.font='15px monospace'; ctx.textAlign='center';
      ctx.fillText('► Zキー / Aボタンでスタート ◄',W/2,H-60);
      ctx.textAlign='left';
    }
    ctx.fillStyle='#666'; ctx.font='11px monospace'; ctx.textAlign='center';
    ctx.fillText('矢印キー：移動  Z/Enter：決定  X/Esc：キャンセル',W/2,H-30);
    ctx.textAlign='left';
  },

  _drawMap(){
    // Tiles
    for(let ty=0;ty<ROWS;ty++) for(let tx=0;tx<COLS;tx++){
      const sx=tx*TILE-Camera.x, sy=ty*TILE-Camera.y;
      if(sx>-TILE&&sx<W+TILE&&sy>-TILE&&sy<H+TILE) Sprite.drawTile(tx,ty,sx,sy);
    }
    // NPCs
    NPCS.forEach(npc=>{
      const sx=npc.tx*TILE-Camera.x, sy=npc.ty*TILE-Camera.y;
      if(npc.type==='minister') Sprite.drawMinister(sx,sy,0,Math.floor(GS.tick/15)%2);
      else Sprite.drawSoldier(sx,sy,0,Math.floor(GS.tick/15)%2);
      const dx=Math.abs(Player.x-npc.tx*TILE), dy=Math.abs(Player.y-npc.ty*TILE);
      if(dx<TILE*1.5&&dy<TILE*1.5){
        ctx.fillStyle=P.gold; ctx.font='12px monospace';
        ctx.fillText('！',sx+TILE/2-4,sy-4);
      }
    });
    // Player
    Player.draw();
    // HUD
    this._drawHUD();
    // NPC dialog
    if(this.npcDialog) dialog.draw();
    // Hint
    if(GS.playerMoved<8){
      ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(W/2-150,8,300,28);
      ctx.fillStyle='#ff0'; ctx.font='12px monospace'; ctx.textAlign='center';
      ctx.fillText('矢印キーで移動  Zキーでイベント発生',W/2,26);
      ctx.textAlign='left';
    }
    // Turn label
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(W-155,0,155,26);
    ctx.fillStyle=P.gold; ctx.font='14px monospace';
    ctx.fillText('TURN '+GS.turn+'/'+GS.maxTurns,W-145,19);
  },

  _drawHUD(){
    const hy=H-48;
    ctx.fillStyle=P.darkBg; ctx.fillRect(0,hy,W,48);
    ctx.strokeStyle=P.gold; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(W,hy); ctx.stroke();
    ctx.lineWidth=1;
    const stats=[
      {key:'happy',label:'幸福',color:P.happy,x:8},
      {key:'tech', label:'技術',color:P.tech, x:163},
      {key:'env',  label:'環境',color:P.env,  x:318},
      {key:'order',label:'秩序',color:P.order,x:473},
    ];
    stats.forEach(s=>{
      const val=GS.stats[s.key];
      ctx.fillStyle='#888'; ctx.font='11px monospace'; ctx.fillText(s.label,s.x,hy+14);
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(s.x,hy+18,130,10);
      ctx.fillStyle=s.color; ctx.fillRect(s.x,hy+18,Math.floor(130*val/100),10);
      ctx.strokeStyle='#444'; ctx.strokeRect(s.x,hy+18,130,10);
      ctx.fillStyle='#fff'; ctx.font='11px monospace'; ctx.fillText(val,s.x+134,hy+28);
    });
  },

  _drawEvent(){
    const ev=EventSys.getCurrent();
    ctx.fillStyle='#080010'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0e0018';
    for(let i=0;i<W;i+=40) for(let j=0;j<H;j+=40) ctx.fillRect(i,j,39,39);
    // Stars
    for(let i=0;i<50;i++){
      ctx.fillStyle='#fff';
      ctx.globalAlpha=Math.sin(GS.tick*0.02+i)*0.3+0.4;
      ctx.fillRect((i*137.5%1)*W,(i*99.3%1)*H,1,1);
    }
    ctx.globalAlpha=1;
    // Header
    ctx.fillStyle='rgba(0,0,14,0.92)'; ctx.fillRect(0,0,W,54);
    ctx.strokeStyle=P.gold; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,54); ctx.lineTo(W,54); ctx.stroke();
    ctx.lineWidth=1;
    ctx.fillStyle=P.gold; ctx.font='bold 15px monospace'; ctx.textAlign='center';
    ctx.fillText('TURN '+GS.turn+' / '+GS.maxTurns,W/2,20);
    if(ev){ctx.fillStyle='#fff'; ctx.font='14px monospace'; ctx.fillText('【 '+ev.title+' 】',W/2,40);}
    ctx.textAlign='left';
    // Illustration
    if(ev) this._eventScene(ev.id);
    // HUD
    this._drawHUD();
    // Dialog
    dialog.draw(16,H-158,W-32,148);
  },

  _eventScene(id){
    const cx=W/2, cy=H/2-20;
    ctx.save();
    if(id===0){
      ctx.fillStyle='#6b4423'; ctx.fillRect(cx-80,cy-30,40,60); ctx.fillRect(cx+40,cy-30,40,60);
      ctx.fillStyle='#aa8866'; ctx.fillRect(cx-10,cy-8,8,20); ctx.fillRect(cx+4,cy-8,8,20);
      ctx.fillStyle='#ffcc88'; ctx.fillRect(cx-8,cy-16,6,8); ctx.fillRect(cx+6,cy-16,6,8);
    } else if(id===1){
      ctx.fillStyle='#334455'; ctx.fillRect(cx-80,cy-40,160,80);
      ctx.fillStyle='#556677'; ctx.fillRect(cx-60,cy-60,20,60); ctx.fillRect(cx+40,cy-60,20,60);
      ctx.fillStyle='#ccc'; ctx.fillRect(cx-3,cy-50,6,50);
      ctx.fillStyle='#888'; ctx.fillRect(cx-14,cy-20,28,6);
    } else if(id===2){
      ctx.fillStyle='#1a3310'; ctx.fillRect(cx-110,cy+10,220,30);
      [-90,-60,-30,0,30,60,90].forEach((dx,i)=>{
        const h=28+((cx+dx)*13%20);
        ctx.fillStyle='#1a5510'; ctx.fillRect(cx+dx-8,cy-h,16,h+10);
        ctx.fillStyle='#2a7520'; ctx.fillRect(cx+dx-5,cy-h-12,10,h*0.7);
      });
    } else if(id===3){
      ctx.fillStyle='#441100'; ctx.fillRect(cx-70,cy-30,140,60);
      ctx.fillStyle='#00aa44';
      for(let i=0;i<8;i++){
        const bx=cx-60+i*16, by=cy-20+Math.sin(i+GS.tick*0.05)*10;
        ctx.beginPath(); ctx.arc(bx,by,5,0,Math.PI*2); ctx.fill();
      }
    } else if(id===4){
      Sprite.drawKnight(cx-16,cy-16,0,Math.floor(GS.tick/10)%2);
    } else if(id===5){
      ctx.fillStyle='#7a5e3c'; ctx.fillRect(cx-50,cy-20,100,40);
      ctx.fillStyle=P.gold; ctx.beginPath(); ctx.arc(cx,cy,16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#7a5e3c'; ctx.font='bold 18px monospace'; ctx.textAlign='center';
      ctx.fillText('¥',cx,cy+7); ctx.textAlign='left';
    } else if(id===6){
      ctx.fillStyle='#ff00ff'; ctx.globalAlpha=0.3+Math.sin(GS.tick*0.1)*0.1;
      ctx.beginPath(); ctx.arc(cx,cy,40,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.fillStyle='#dd44ff';
      for(let i=0;i<6;i++){
        const a=GS.tick*0.05+i*(Math.PI/3);
        ctx.beginPath(); ctx.arc(cx+Math.cos(a)*35,cy+Math.sin(a)*35,6,0,Math.PI*2); ctx.fill();
      }
    } else if(id===7){
      ctx.fillStyle='#333'; ctx.fillRect(cx-80,cy-40,80,80);
      ctx.fillStyle='#444'; ctx.fillRect(cx,cy-40,80,80);
      ctx.fillStyle='#666'; ctx.fillRect(cx-3,cy-50,6,20);
      ctx.fillStyle='#888'; ctx.fillRect(cx-3,cy+30,6,20);
    } else if(id===8){
      const rg=ctx.createRadialGradient(cx,cy,4,cx,cy,70);
      rg.addColorStop(0,'rgba(255,250,160,0.9)'); rg.addColorStop(1,'rgba(255,200,0,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,cy,70,0,Math.PI*2); ctx.fill();
      Sprite.drawKing(cx-16,cy-16,1,Math.floor(GS.tick/10)%2);
    }
    ctx.restore();
  },

  _drawEnding(){
    const e=ENDINGS[this.endingIdx]||ENDINGS[4];
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#050510'); g.addColorStop(1,'#100508');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // Stars
    for(let i=0;i<90;i++){
      ctx.fillStyle='#fff';
      ctx.globalAlpha=Math.sin(GS.tick*0.02+i)*0.4+0.6;
      ctx.fillRect((i*137.5%1)*W,(i*99.3%1)*H,i%8===0?2:1,i%8===0?2:1);
    }
    ctx.globalAlpha=1;
    // Stat summary
    const sx=40,sy=55;
    ctx.fillStyle='rgba(0,0,14,0.88)'; ctx.fillRect(sx,sy,W-80,106);
    ctx.strokeStyle='#446'; ctx.lineWidth=2; ctx.strokeRect(sx,sy,W-80,106);
    ctx.fillStyle='#aaa'; ctx.font='13px monospace'; ctx.textAlign='center';
    ctx.fillText('─ 最終ステータス ─',W/2,sy+18); ctx.textAlign='left';
    [{key:'happy',label:'幸福',color:P.happy},{key:'tech',label:'技術',color:P.tech},{key:'env',label:'環境',color:P.env},{key:'order',label:'秩序',color:P.order}].forEach((s,i)=>{
      const bx=sx+18+i*145, by=sy+28;
      ctx.fillStyle=s.color; ctx.font='12px monospace'; ctx.fillText(s.label,bx,by+14);
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx,by+18,120,10);
      ctx.fillStyle=s.color; ctx.fillRect(bx,by+18,Math.floor(120*GS.stats[s.key]/100),10);
      ctx.strokeStyle='#444'; ctx.strokeRect(bx,by+18,120,10);
      ctx.fillStyle='#fff'; ctx.font='11px monospace'; ctx.fillText(GS.stats[s.key],bx+124,by+28);
    });
    // Ending title box
    ctx.fillStyle='rgba(0,0,14,0.92)'; ctx.fillRect(W/2-205,H/2-68,410,84);
    ctx.strokeStyle=e.color; ctx.lineWidth=3; ctx.strokeRect(W/2-205,H/2-68,410,84);
    ctx.lineWidth=1;
    ctx.fillStyle=e.color; ctx.font='bold 22px monospace'; ctx.textAlign='center';
    ctx.fillText(e.title,W/2,H/2-28);
    ctx.textAlign='left';
    // Story
    const lines=e.text.split('\n');
    const tby=H/2+30;
    ctx.fillStyle='rgba(0,0,14,0.82)'; ctx.fillRect(40,tby-22,W-80,lines.length*23+22);
    ctx.strokeStyle='#446'; ctx.lineWidth=1; ctx.strokeRect(40,tby-22,W-80,lines.length*23+22);
    lines.forEach((l,i)=>{
      ctx.fillStyle='#ddd'; ctx.font='14px monospace'; ctx.textAlign='center';
      ctx.fillText(l,W/2,tby+i*23);
    });
    ctx.textAlign='left';
    // Continue prompt
    if(this.endingTick>120&&Math.floor(this.endingTick/25)%2===0){
      ctx.fillStyle=P.gold; ctx.font='14px monospace'; ctx.textAlign='center';
      ctx.fillText('Zキー / Aボタンでタイトルへ戻る',W/2,H-22);
      ctx.textAlign='left';
    }
  }
};

// ============================================================
//  Game Loop
// ============================================================
function loop(){
  Input.pollGamepad();
  Scenes.update();
  Scenes.draw();
  requestAnimationFrame(loop);
}

EventSys.buildQueue();
requestAnimationFrame(loop);
</script>
